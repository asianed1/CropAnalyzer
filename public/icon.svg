<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Deep agricultural green backdrop -->
  <rect width="512" height="512" rx="112" fill="#1B5E20" />
  <!-- White circle centerpiece -->
  <circle cx="256" cy="256" r="204" fill="#FFFFFF" stroke="#DCFCE7" stroke-width="6" />

  <!-- Crop 1 (Left): Green Rice Stalk & Drooping Grain Panicle -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M168 378 C166 312, 160 250, 142 198 C134 176, 124 162, 114 152" fill="none" stroke="#1B5E20" stroke-width="10" />
    <path d="M166 338 C136 312, 118 280, 112 246 C136 266, 154 294, 166 326 Z" fill="#2E7D32" />
    <path d="M165 304 C188 280, 202 256, 206 232 C188 250, 174 274, 165 296 Z" fill="#43A047" />
    <!-- Plump rice grains along arching tip -->
    <ellipse cx="144" cy="198" rx="9" ry="16" transform="rotate(-24 144 198)" fill="#2E7D32" />
    <ellipse cx="129" cy="176" rx="9" ry="15" transform="rotate(-38 129 176)" fill="#43A047" />
    <ellipse cx="154" cy="172" rx="8" ry="14" transform="rotate(-10 154 172)" fill="#1B5E20" />
    <ellipse cx="116" cy="158" rx="8" ry="14" transform="rotate(-50 116 158)" fill="#2E7D32" />
    <ellipse cx="138" cy="150" rx="8" ry="13" transform="rotate(-28 138 150)" fill="#43A047" />
  </g>

  <!-- Crop 2 (Center): Green Corn Cob in Open Husk Leaves -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Silk tuft -->
    <path d="M256 122 C250 106, 246 98, 242 92 M256 122 C256 104, 258 96, 258 88 M256 122 C263 106, 268 98, 272 93" fill="none" stroke="#1B5E20" stroke-width="6" />
    <!-- Corn ear body (fresh green sweet corn) -->
    <path d="M256 118 C286 118, 300 164, 296 244 C294 296, 280 342, 256 348 C232 342, 218 296, 216 244 C212 164, 226 118, 256 118 Z" fill="#43A047" stroke="#1B5E20" stroke-width="6" />
    <!-- Kernel grid lines -->
    <path d="M235 148 H277 M228 176 H284 M225 204 H287 M226 232 H286 M228 260 H284 M242 130 V290 M256 122 V298 M270 130 V290" fill="none" stroke="#DCFCE7" stroke-width="3.5" opacity="0.9" />
    <!-- Open left & right green husk leaves -->
    <path d="M254 368 C210 346, 186 286, 194 218 C212 246, 232 292, 256 336 Z" fill="#1B5E20" />
    <path d="M258 368 C302 346, 326 286, 318 218 C300 246, 280 292, 256 336 Z" fill="#2E7D32" />
    <path d="M256 382 V334" fill="none" stroke="#1B5E20" stroke-width="12" />
  </g>

  <!-- Crop 3 (Right): Green Tomato / Broad-Leaf Vegetable Crop -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M342 378 C342 326, 350 282, 362 248" fill="none" stroke="#1B5E20" stroke-width="10" />
    <!-- Broad leaf behind fruit -->
    <path d="M352 298 C382 276, 408 242, 410 206 C380 212, 354 242, 346 278 Z" fill="#43A047" />
    <path d="M352 298 L394 226" fill="none" stroke="#1B5E20" stroke-width="4" />
    <!-- Plump green tomato / fruit crop -->
    <circle cx="358" cy="236" r="42" fill="#2E7D32" stroke="#1B5E20" stroke-width="6" />
    <!-- Highlight -->
    <path d="M336 222 C338 210, 348 202, 360 202" fill="none" stroke="#A7F3D0" stroke-width="5" />
    <!-- Star calyx at top of fruit -->
    <path d="M358 194 L344 176 L354 188 L358 170 L362 188 L374 176 L358 194 Z" fill="#1B5E20" stroke="#1B5E20" stroke-width="3" />
    <!-- Small secondary leaf -->
    <path d="M344 334 C316 320, 304 298, 302 278 C326 286, 338 308, 344 330 Z" fill="#2E7D32" />
  </g>
</svg>
